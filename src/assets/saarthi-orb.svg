<svg width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Cosmic Sphere Base -->
    <radialGradient id="saarthiSphereBase" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4f75ff" />
      <stop offset="28%" stop-color="#2838cc" />
      <stop offset="60%" stop-color="#12166a" />
      <stop offset="85%" stop-color="#0a0c33" />
      <stop offset="100%" stop-color="#05061a" />
    </radialGradient>
    
    <!-- Violet / Magenta Rim Glow on lower-right -->
    <radialGradient id="saarthiVioletGlow" cx="78%" cy="78%" r="55%">
      <stop offset="0%" stop-color="#c026d3" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#9333ea" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Specular Crescent Arc -->
    <linearGradient id="saarthiGlassSheen" x1="15%" y1="10%" x2="85%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#e0e7ff" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#a5b4fc" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Shadow / Soft Glow -->
    <filter id="saarthiSphereGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient outer glow circle -->
  <circle cx="17" cy="17" r="14.5" fill="#3b82f6" opacity="0.25" filter="url(#saarthiSphereGlow)" />
  
  <!-- Base Sphere Body -->
  <circle cx="17" cy="17" r="14" fill="url(#saarthiSphereBase)" />

  <!-- Purple/Magenta illumination on bottom-right -->
  <circle cx="17" cy="17" r="14" fill="url(#saarthiVioletGlow)" />

  <!-- Curved glass light reflection arc on top-right -->
  <path d="M 8 13 C 12 7.5, 22 7.5, 26 13 C 24 9.5, 13 9.5, 8 13 Z" fill="url(#saarthiGlassSheen)" />

  <!-- Soft top highlight reflection dot -->
  <ellipse cx="16.5" cy="8.2" rx="4.5" ry="1.8" fill="#ffffff" opacity="0.7" />
  
  <!-- Subtle inner edge highlight -->
  <circle cx="17" cy="17" r="13.7" stroke="rgba(255,255,255,0.15)" stroke-width="0.6" fill="none" />
</svg>
